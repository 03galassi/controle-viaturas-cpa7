<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#170d08">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pão da Dilma">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="./icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<title>Pão da Dilma</title>
<link rel="stylesheet" href="./styles.css?v=21">
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand">
      <div class="brandMark">🥖</div>
      <div><strong>Pão</strong><span>da Dilma</span></div>
    </div>
    <div class="search"><span>⌕</span><input id="globalSearch" placeholder="Buscar cliente..." autocomplete="off"></div>
    <button class="iconBtn" id="notifyBtn" aria-label="Notificações">🔔<b id="notifyCount">0</b></button>
  </header>

  <main id="content"></main>

  <nav class="bottomNav">
    <button data-screen="home" class="active">⌂<span>Início</span></button>
    <button data-screen="sales">▤<span>Vendas</span></button>
    <button data-screen="clients">♟<span>Clientes</span></button>
    <button data-screen="deliveries">🚚<span>Entregas</span><b id="deliveryBadge">0</b></button>
    <button data-screen="receivables" aria-label="A receber"><span id="navDueAmount" class="navAmount">R$</span><span>A receber</span></button>
    <button data-screen="more" aria-label="Gastos e relatórios"><span class="navIcon">📊</span><span>Gastos/Relatórios</span></button>
  </nav>
</div>

<div id="modal" class="modal hidden">
  <div class="modalCard">
    <button class="close" id="closeModal">×</button>
    <div id="modalBody"></div>
  </div>
</div>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script src="./firebase-sync.js?v=1"></script>
<script src="./drive.js?v=21"></script>
<script src="./app.js?v=23"></script>
</body>
</html>
